; PlatformIO Project Configuration File
;
; Prism — USB Serial LED Controller Firmware
; Target: Seeed XIAO ESP32-S3
; Framework: Arduino

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

; Enable USB CDC on boot so Serial uses the native USB-OTG port
board_build.arduino.cdc_on_boot = 1

build_flags =
    -DPRISM_STRIP_COUNT=4
    -DPRISM_MAX_PIXELS_PER_STRIP=144

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
