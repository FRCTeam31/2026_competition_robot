; PlatformIO Project Configuration File
;
; Prism — USB Serial LED Controller Firmware
; Target: Seeed XIAO ESP32-C3
; Framework: ESP-IDF (no Arduino)

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf

monitor_speed = 2000000

build_flags =
    -DPRISM_STRIP_COUNT=4
    -DPRISM_MAX_PIXELS_PER_STRIP=144
    -Iinclude
